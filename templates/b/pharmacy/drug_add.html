<!-- templates/b/pharmacy/drug_add.html -->


{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Add Drug - Pharmacy{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-8 mx-auto">
        <div class="card card-custom">
            <div class="card-header">
                <h5 class="mb-0"><i class="fas fa-plus-circle text-success me-2"></i>Add New Drug</h5>
            </div>
            <div class="card-body">
                <form method="post" novalidate>
                    {% csrf_token %}
                    {{ form|crispy }}
                    <div class="mt-4 d-flex justify-content-between">
                        <a href="{% url 'b:pharmacy_drug_list' %}" class="btn btn-secondary">
                            <i class="fas fa-arrow-left me-2"></i> Cancel
                        </a>
                        <button type="submit" class="btn btn-success">
                            <i class="fas fa-save me-2"></i> Add Drug
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
