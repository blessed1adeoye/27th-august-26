<!-- templates/auth_base.html -->



{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}HIM - Health Information Management{% endblock %}</title>
    
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    
    <style>
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #0d3b3a 0%, #1a5f59 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .auth-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 480px;
            width: 100%;
            animation: slideUp 0.5s ease;
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .auth-card .logo {
            font-size: 3rem;
            color: #065f46;
        }
        
        .auth-card .brand {
            font-weight: 700;
            font-size: 1.5rem;
            color: #065f46;
        }
        
        .auth-card .subtitle {
            color: #6b7280;
            font-size: 0.9rem;
        }
        
        .auth-card .form-control {
            border-radius: 10px;
            border: 2px solid #e5e7eb;
            padding: 12px 16px;
            transition: all 0.2s;
        }
        
        .auth-card .form-control:focus {
            border-color: #065f46;
            box-shadow: 0 0 0 0.2rem rgba(6, 95, 70, 0.1);
        }
        
        .auth-card .btn-success {
            background: #065f46;
            border-color: #065f46;
            border-radius: 10px;
            padding: 12px;
            font-weight: 600;
            transition: all 0.2s;
        }
        
        .auth-card .btn-success:hover {
            background: #0d3b3a;
            border-color: #0d3b3a;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(6, 95, 70, 0.3);
        }
        
        .password-toggle .toggle-btn {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #9ca3af;
            cursor: pointer;
            padding: 0 8px;
            font-size: 1.1rem;
            z-index: 10;
            transition: color 0.2s;
        }
        
        .password-toggle .toggle-btn:hover {
            color: #065f46;
        }
        
        .password-toggle .form-control {
            padding-right: 45px;
        }
        
        .demo-credentials {
            background: #f8fafc;
            border-radius: 10px;
            padding: 12px;
            margin-top: 10px;
        }
        
        .demo-credentials code {
            background: #e5e7eb;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            color: #1f2937;
        }
        
        .role-badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 0.7rem;
            font-weight: 600;
            margin-right: 4px;
        }
        
        .role-badge.him { background: #dbeafe; color: #1e40af; }
        .role-badge.nurse { background: #d1fae5; color: #065f46; }
        .role-badge.doctor { background: #fef3c7; color: #92400e; }
        .role-badge.pharmacy { background: #e0e7ff; color: #3730a3; }
        .role-badge.mls { background: #fce4ec; color: #9a1f3f; }
        .role-badge.optician { background: #f3e8ff; color: #6d28d9; }
        
        @media (max-width: 576px) {
            .auth-card {
                padding: 24px 20px;
            }
            .auth-card .logo {
                font-size: 2.5rem;
            }
            .auth-card .brand {
                font-size: 1.2rem;
            }
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <div class="auth-card">
        {% block content %}{% endblock %}
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
